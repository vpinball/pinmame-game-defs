[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinmame-game-defs"
version = "0.1.0"
description = "PinMAME machine-definition catalog and evidence tooling"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "jsonschema>=4.23,<5",
  "pdfplumber>=0.11,<1",
]

[project.scripts]
pinmame-game-defs = "pinmame_game_defs.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
